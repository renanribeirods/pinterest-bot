<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1000px;height:1500px;overflow:hidden}
*{box-sizing:border-box}
body{position:relative;background-color:#C49A6C;background-image:radial-gradient(rgba(90,55,25,.35) 1.5px,transparent 1.7px),radial-gradient(rgba(255,240,210,.28) 1.2px,transparent 1.4px);background-size:22px 22px,17px 17px;background-position:0 0,9px 7px;box-shadow:inset 0 0 0 24px #7E5130,inset 0 0 0 30px #6A4326;color:#1F1A17}
.paper{position:absolute;left:70px;top:72px;width:860px;height:590px;background:#FFFDF7;transform:rotate(-1.2deg);box-shadow:0 18px 30px -12px rgba(50,25,5,.5)}
.pin{position:absolute;left:418px;top:-14px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FF7A6E,#C42A20);box-shadow:0 5px 6px rgba(0,0,0,.35)}
.h{position:absolute;left:56px;top:58px;width:760px;margin:0;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:122px;line-height:1;letter-spacing:-2px}
.h .n{color:#E2483D}
.hl{background:linear-gradient(transparent 56%,#FFE066 56%,#FFE066 92%,transparent 92%)}
.stampl{position:absolute;right:46px;top:66px;padding:8px 14px;border:3px solid #E2483D;color:#E2483D;font-family:'Archivo Black',sans-serif;font-size:17px;letter-spacing:.06em;text-transform:uppercase;transform:rotate(6deg)}
.sup{position:absolute;left:56px;top:442px;width:740px;font-family:'Caveat',cursive;font-weight:600;font-size:48px;line-height:1.1;color:#4B3F36}
.note{position:absolute;width:395px;height:300px;box-shadow:0 16px 24px -12px rgba(50,25,5,.55)}
.tape{position:absolute;left:132px;top:-18px;width:130px;height:38px;background:rgba(255,255,255,.55);transform:rotate(-4deg)}
.nn{position:absolute;left:38px;top:40px;font-family:'Archivo Black',sans-serif;font-size:64px;line-height:1;color:rgba(31,26,23,.85)}
.nt{position:absolute;left:38px;top:132px;width:325px;font-family:'Caveat',cursive;font-weight:700;font-size:60px;line-height:1.0}
.cta{position:absolute;left:50%;top:1382px;transform:translateX(-50%) rotate(-1.5deg);height:68px;padding:0 34px;background:#1F1A17;color:#FFE066;font-family:'Archivo Black',sans-serif;font-size:27px;line-height:68px;white-space:nowrap;box-shadow:0 12px 20px -10px rgba(0,0,0,.6)}
</style></head><body>
<div class="paper"><div class="pin"></div>
<div class="stampl">Notion Template</div>
<h1 class="h"><span class="n">4</span> Ways<br>to Fill<br><span class="hl">Ad Slots</span></h1>
<div class="sup">Inside a Notion newsletter sponsorship CRM</div>
</div>
<div class="note" style="left:80px;top:705px;background:#FFE680;transform:rotate(-2.5deg)"><div class="tape"></div><div class="nn">01</div><div class="nt">Track every pitch</div></div>
<div class="note" style="left:522px;top:695px;background:#FFB8C6;transform:rotate(2deg)"><div class="tape" style="transform:rotate(5deg)"></div><div class="nn">02</div><div class="nt">See open slots</div></div>
<div class="note" style="left:88px;top:1040px;background:#B8F0D2;transform:rotate(1.5deg)"><div class="tape" style="transform:rotate(3deg)"></div><div class="nn">03</div><div class="nt">Chase unpaid invoices</div></div>
<div class="note" style="left:515px;top:1045px;background:#B8DBFF;transform:rotate(-2deg)"><div class="tape" style="transform:rotate(-6deg)"></div><div class="nn">04</div><div class="nt">Never miss a renewal</div></div>
<div class="cta">Get the Template</div>
</body></html>
