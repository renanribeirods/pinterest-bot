<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1000px;height:1500px;overflow:hidden}
body{position:relative;background:#F6EFE4;font-family:'Inter',sans-serif;color:#1F3A2E}
.tag{position:absolute;left:70px;top:58px;font:800 20px/1 'Inter',sans-serif;letter-spacing:4px;text-transform:uppercase;color:#C8552B}
h1{position:absolute;left:66px;top:96px;width:870px;margin:0;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:128px;line-height:1;letter-spacing:-3px;color:#1F3A2E}
h1 em{font-style:normal;color:#C8552B}
.scrib{position:absolute;left:70px;top:464px}
.card{position:absolute;top:530px;width:400px;height:510px;border-radius:28px;overflow:hidden}
.before{left:70px;background:#E9DCCB}
.after{left:530px;background:#fff;box-shadow:0 22px 44px rgba(31,58,46,.16)}
.lbl{position:absolute;left:24px;top:22px;font:800 17px/1 'Inter',sans-serif;letter-spacing:3px;text-transform:uppercase;padding:10px 16px;border-radius:30px}
.before .lbl{background:#fff;color:#8A7A68}
.after .lbl{background:#1F3A2E;color:#fff}
.b{position:absolute;border-radius:22px;padding:20px 20px 10px;box-sizing:border-box;box-shadow:0 6px 14px rgba(0,0,0,.06)}
.b i{display:block;height:11px;border-radius:6px;background:#D6CABA;margin-bottom:11px}
.b.dk{background:#1F3A2E}.b.dk i{background:rgba(255,255,255,.35)}
.b.wh{background:#fff}
.sticky{position:absolute;left:228px;top:318px;width:140px;height:140px;background:#F2C14E;transform:rotate(8deg);padding:26px 18px;box-sizing:border-box;box-shadow:0 8px 16px rgba(0,0,0,.1)}
.sticky i{display:block;height:9px;border-radius:5px;background:rgba(31,58,46,.25);margin-bottom:14px}
.q{position:absolute;font-family:'Archivo Black',sans-serif;color:#C8552B;line-height:1}
.arrow{position:absolute;left:470px;top:755px;width:60px;height:60px;border-radius:50%;background:#C8552B;display:flex;align-items:center;justify-content:center;z-index:3;box-shadow:0 6px 14px rgba(200,85,43,.35)}
.ah{position:absolute;left:28px;top:84px;font:800 22px/1 'Inter',sans-serif;color:#1F3A2E}
.days{position:absolute;left:28px;top:124px;width:344px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;font:700 14px/1 'Inter',sans-serif;color:#9AA79F;text-align:center}
.cal{position:absolute;left:28px;top:150px;width:344px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal span{height:40px;border-radius:9px;background:#E7EFE9}
.cal .f{background:#2F5D4A}.cal .r{background:#C8552B}
.list{position:absolute;left:28px;top:360px;width:344px}
.row{display:flex;align-items:center;height:44px;font:600 19px/1 'Inter',sans-serif;color:#1F3A2E}
.cb{width:24px;height:24px;border-radius:6px;background:#2F5D4A;margin-right:14px;display:flex;align-items:center;justify-content:center;flex:none}
.row b{flex:1;height:8px;border-radius:4px;background:#EEE7DC;margin-left:14px}
.sup{position:absolute;left:70px;top:1088px;width:860px;text-align:center;font:800 40px/1.2 'Inter',sans-serif;color:#1F3A2E;letter-spacing:-.5px}
.feat{position:absolute;top:1172px;left:70px;width:860px;display:flex;justify-content:space-between}
.feat div{width:270px;text-align:center;font:700 25px/1.25 'Inter',sans-serif;color:#1F3A2E}
.ic{width:60px;height:60px;border-radius:50%;background:#1F3A2E;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.cta{position:absolute;left:0;right:0;top:1362px;text-align:center}
.cta span{display:inline-block;background:#C8552B;color:#fff;font:800 28px/1 'Inter',sans-serif;padding:25px 52px;border-radius:60px;letter-spacing:.5px}
</style></head><body>
<div class="tag">Dog Boarding Planner</div>
<h1>No More<br>Booking<br><em>Chaos</em></h1>
<svg class="scrib" width="500" height="34" viewBox="0 0 500 34"><path d="M6 22 C 120 6, 260 8, 494 14 M30 30 C 160 18, 300 20, 440 26" fill="none" stroke="#1F3A2E" stroke-width="6" stroke-linecap="round"/></svg>

<div class="card before">
  <div class="lbl">Before</div>
  <div class="q" style="left:318px;top:22px;font-size:62px;transform:rotate(12deg)">?</div>
  <div class="b wh" style="left:24px;top:88px;width:250px;transform:rotate(-3deg)"><i style="width:92%"></i><i style="width:58%"></i></div>
  <div class="b dk" style="left:128px;top:186px;width:244px;transform:rotate(2deg)"><i style="width:85%"></i><i style="width:66%"></i></div>
  <div class="b wh" style="left:26px;top:286px;width:214px;transform:rotate(4deg)"><i style="width:80%"></i><i style="width:94%"></i><i style="width:50%"></i></div>
  <div class="sticky"><i style="width:90%"></i><i style="width:70%"></i><i style="width:84%"></i></div>
  <div class="q" style="left:46px;top:392px;font-size:96px;transform:rotate(-10deg)">?</div>
  <div class="q" style="left:140px;top:420px;font-size:58px;transform:rotate(8deg);color:#1F3A2E">!</div>
</div>

<div class="arrow"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<div class="card after">
  <div class="lbl">After</div>
  <div class="ah">Nightly Capacity</div>
  <div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  <div class="cal">
    <span class="f"></span><span class="f"></span><span class="f"></span><span class="r"></span><span class="f"></span><span class="f"></span><span></span>
    <span class="f"></span><span class="f"></span><span class="f"></span><span class="f"></span><span class="r"></span><span class="r"></span><span class="f"></span>
    <span class="f"></span><span></span><span class="f"></span><span class="f"></span><span class="f"></span><span class="f"></span><span class="f"></span>
    <span></span><span></span><span class="f"></span><span class="f"></span><span class="f"></span><span class="r"></span><span class="r"></span>
  </div>
  <div class="list">
    <div class="row"><span class="cb"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Deposit<b></b></div>
    <div class="row"><span class="cb"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Vaccines<b></b></div>
    <div class="row"><span class="cb" style="background:#C8552B"><svg width="16" height="16" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Waitlist<b></b></div>
  </div>
</div>

<div class="sup">Track every dog, deposit and vaccine</div>
<div class="feat">
  <div><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#F6EFE4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Nightly capacity view</div>
  <div><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#F6EFE4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Deposit tracking</div>
  <div><div class="ic"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#F6EFE4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>Vaccine reminders</div>
</div>
<div class="cta"><span>Instant Download</span></div>
</body></html>
