<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&display=block" rel="stylesheet"><style>
html,body{margin:0;width:1000px;height:1500px;overflow:hidden}
body{position:relative;background-color:#C8965F;background-image:radial-gradient(#A9773F 1.6px,transparent 2.2px),radial-gradient(#DDB07C 1.2px,transparent 2px);background-size:14px 14px,23px 23px;background-position:0 0,7px 11px;box-shadow:inset 0 0 0 26px #6E4526,inset 0 0 0 30px #573519,inset 0 0 60px 40px rgba(80,45,15,.35)}
.panel{position:absolute;left:64px;top:74px;width:872px;height:610px;background:#FFFDF7;transform:rotate(-1.2deg);box-shadow:0 18px 30px rgba(50,25,5,.35)}
.tape{position:absolute;width:150px;height:42px;background:rgba(255,240,190,.75);box-shadow:0 2px 3px rgba(0,0,0,.1)}
h1{position:absolute;left:50px;top:52px;width:772px;margin:0;font:400 128px/128px Anton;color:#1C1C1C;text-transform:uppercase;letter-spacing:1px}
h1 span{color:#E63946;position:relative}
.mark{position:absolute;left:46px;top:422px;width:250px;height:22px}
.sub{position:absolute;left:50px;top:462px;width:772px;font:700 52px/58px Caveat;color:#33465F}
.note{position:absolute;width:268px;height:268px;box-shadow:0 14px 20px rgba(50,25,5,.35);box-sizing:border-box;padding:70px 22px 0;text-align:center;font:700 54px/54px Caveat;color:#1C1C1C}
.pin{position:absolute;left:50%;top:16px;width:30px;height:30px;margin-left:-15px;border-radius:50%;box-shadow:0 5px 5px rgba(0,0,0,.35)}
.n1{left:72px;top:770px;background:#FFE066;transform:rotate(-4deg)}
.n2{left:366px;top:752px;background:#FF9EB5;transform:rotate(2.5deg)}
.n3{left:660px;top:774px;background:#9BE3C3;transform:rotate(-2deg)}
.card{position:absolute;left:170px;top:1120px;width:660px;height:250px;background:#fff;background-image:repeating-linear-gradient(transparent 0 46px,#CFE0F2 46px 48px);transform:rotate(1deg);box-shadow:0 14px 24px rgba(50,25,5,.35)}
.card:before{content:'';position:absolute;left:70px;top:0;bottom:0;border-left:2px solid #F3A6AE}
.ct{position:absolute;left:96px;top:30px;width:520px;font:400 48px/56px Anton;color:#1C1C1C;letter-spacing:.5px}
.cs{position:absolute;left:96px;top:92px;width:520px;font:700 40px/48px Caveat;color:#33465F}
.cta{position:absolute;left:96px;top:160px;width:330px;height:62px;border-radius:34px;background:#E63946;text-align:center;font:400 28px/62px Anton;color:#fff;letter-spacing:1.5px}
</style></head><body>
<div class="panel">
<div class="tape" style="left:-30px;top:-14px;transform:rotate(-30deg)"></div>
<div class="tape" style="right:-30px;top:-14px;transform:rotate(30deg)"></div>
<h1>Real-World<br>Money Skills,<br><span>Fast.</span></h1>
<svg class="mark" viewBox="0 0 250 22"><path d="M4 14 C60 4 140 20 246 8" fill="none" stroke="#E63946" stroke-width="7" stroke-linecap="round"/></svg>
<div class="sub">Teach budgeting without adding planning time</div>
</div>
<div class="note n1"><div class="pin" style="background:radial-gradient(circle at 35% 35%,#FF8A8A,#C81E2B)"></div>Saves planning time</div>
<div class="note n2"><div class="pin" style="background:radial-gradient(circle at 35% 35%,#8AB8FF,#1E4FC8)"></div>Real-life skills</div>
<div class="note n3"><div class="pin" style="background:radial-gradient(circle at 35% 35%,#FFE38A,#D19A0B)"></div>Classroom or homeschool</div>
<div class="card">
<div class="tape" style="left:255px;top:-20px;transform:rotate(-3deg)"></div>
<div class="ct">BUDGETING WORKSHEET</div>
<div class="cs">Print &amp; go personal finance activity</div>
<div class="cta">GRAB YOURS TODAY</div>
</div>
</body></html>
