.sub{position:absolute;left:60px;top:358px;width:880px;text-align:center;font-size:32px;line-height:1.3;color:#6B4A63;}

.chip{padding:16px 24px;border-radius:40px;background:#fff;font-size:22px;font-weight:700;color:#3B1F3A;display:flex;align-items:center;gap:10px;white-space:nowrap;}
.dot{width:12px;height:12px;border-radius:50%;background:#A4506A;}
.cta{position:absolute;left:330px;top:1290px;width:340px;height:76px;border-radius:44px;background:#3B1F3A;color:#F6E9E4;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;}
.foot{position:absolute;left:60px;top:1396px;width:880px;text-align:center;font-size:19px;letter-spacing:3px;color:#7B5A72;font-weight:500;text-transform:uppercase;}
