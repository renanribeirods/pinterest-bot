<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet"><style>
html,body{margin:0;width:1000px;height:1500px;overflow:hidden;}
body{background:#FAF7F0;font-family:'Inter',sans-serif;color:#1E2235;position:relative;}
*{box-sizing:border-box;}
.top{position:absolute;left:0;top:0;width:1000px;height:660px;background:#1E2235;}
h1{position:absolute;left:60px;top:78px;width:620px;margin:0;font-family:'Archivo Black',sans-serif;font-weight:400;font-size:142px;line-height:.98;color:#FFD45C;letter-spacing:-2px;}
h1 span{color:#FAF7F0;}
.phone{position:absolute;left:680px;top:120px;}
.sub{position:absolute;left:60px;top:556px;width:880px;font-size:34px;font-weight:500;line-height:1.3;color:#FAF7F0;}
.sub b{color:#FFD45C;font-weight:700;}
.card{position:absolute;left:60px;top:705px;width:880px;height:380px;background:#fff;border-radius:16px;box-shadow:0 22px 50px rgba(30,34,53,.14);padding:30px 36px;transform:rotate(-1deg);}
.ct{font-family:'Archivo Black',sans-serif;font-size:30px;color:#1E2235;display:flex;justify-content:space-between;align-items:center;}
.ct small{font-family:'Inter',sans-serif;font-size:15px;letter-spacing:2px;color:#FF6B4A;font-weight:700;}
.th,.tr{display:grid;grid-template-columns:110px 200px 1fr 90px;gap:16px;align-items:center;}
.th{margin-top:20px;padding-bottom:10px;border-bottom:2px solid #1E2235;font-size:14px;font-weight:700;letter-spacing:2px;color:#6A6E80;text-transform:uppercase;}
.tr{height:60px;border-bottom:1.5px solid #ECE7DC;}
.bar{height:10px;border-radius:6px;background:#D9DBE3;}
.box{width:26px;height:26px;border:2.5px solid #1E2235;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.st{position:absolute;top:1125px;width:260px;height:220px;padding:58px 24px 20px;font-size:29px;line-height:1.2;font-weight:700;text-align:center;color:#1E2235;box-shadow:0 14px 26px rgba(30,34,53,.14);}
.st:before{content:'';position:absolute;left:85px;top:-14px;width:90px;height:30px;background:rgba(255,255,255,.6);transform:rotate(-4deg);}
.cta{position:absolute;left:60px;top:1404px;width:880px;text-align:center;font-size:24px;font-weight:700;letter-spacing:1px;color:#1E2235;}
.cta span{border-bottom:4px solid #FF6B4A;padding-bottom:4px;}
</style></head><body>
<div class="top"></div>
<h1>Out Of<br>Stock<br><span>Again?</span></h1>
<svg class="phone" width="260" height="300" viewBox="0 0 260 300"><g transform="translate(20,70) scale(8.5)"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z" fill="#FFD45C"/></g><path d="M170 40 a60 60 0 0 1 60 60" fill="none" stroke="#FF6B4A" stroke-width="10" stroke-linecap="round"/><path d="M168 0 a100 100 0 0 1 90 90" fill="none" stroke="#FF6B4A" stroke-width="10" stroke-linecap="round" opacity=".55"/></svg>
<div class="sub">Keep <b>every pharmacy call</b> in one place</div>
<div class="card">
<div class="ct">Pharmacy Call Log<small>CALL NOTES</small></div>
<div class="th"><div>Date</div><div>Pharmacy</div><div>Notes</div><div>In stock</div></div>
<div class="tr"><div class="bar" style="width:70px"></div><div class="bar" style="width:150px"></div><div class="bar" style="width:80%"></div><div class="box"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#FF6B4A" stroke-width="2.6" stroke-linecap="round"/></svg></div></div>
<div class="tr"><div class="bar" style="width:70px"></div><div class="bar" style="width:120px"></div><div class="bar" style="width:60%"></div><div class="box"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#FF6B4A" stroke-width="2.6" stroke-linecap="round"/></svg></div></div>
<div class="tr"><div class="bar" style="width:70px"></div><div class="bar" style="width:160px"></div><div class="bar" style="width:90%"></div><div class="box" style="background:#1E2235"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" stroke="#FFD45C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
<div class="tr" style="border-bottom:none"><div class="bar" style="width:70px;background:#ECEDF1"></div><div class="bar" style="width:130px;background:#ECEDF1"></div><div class="bar" style="width:50%;background:#ECEDF1"></div><div class="box"></div></div>
</div>
<div class="st" style="left:60px;background:#FFD45C;transform:rotate(-3deg)">Note who said what</div>
<div class="st" style="left:370px;background:#FFB4A2;transform:rotate(2deg)">Backup pharmacy list</div>
<div class="st" style="left:680px;background:#BFE3D0;transform:rotate(-2deg)">Spot generic changes</div>
<div class="cta"><span>Link in Description</span></div>
</body></html>
